---
- name: practicing Ansible
  hosts: dev
  connection: ssh

  tasks:
    - name: Remove tree
      yum:
          name: tree
          state: present

~







---
- name: installtion
  hosts: dev
  connection: ssh


  tasks:
    - name: Installing tree packege
      action: yum name=tree state=present







---
- hosts: dev
  connection: ssh





  vars:
    pack:



  tasks:
    - name: Installing/Removing {{pack}} package
      command: yum remove {{pack}} -y
~                                   



      







