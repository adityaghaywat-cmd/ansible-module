---
- name: Deploy website on Apache server
  hosts: dev
  become: yes

  tasks:
    - name: Install Apache
      package:
        name: httpd
        state: present

    - name: Start and enable Apache
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Create index.html
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>My Website</title>
          </head>
          <body>
              <h1>Open Website</h1>
              <p>Deployed using Ansible.</p>
          </body>
          </html>
        owner: root
        group: root
        mode: '0644'

    - name: Open HTTP port in firewall
      firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes
      when: ansible_os_family == "RedHat"
