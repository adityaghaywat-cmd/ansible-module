---
- hosts: webserver
  become: yes

  tasks:

    - name: Install nginx
      yum:
        name: nginx
        state: present

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Copy website files to remote machine
      copy:
        src: /root/project2/index.html
        dest: /usr/share/nginx/html/
        owner: nginx
        group: nginx
        mode: '0755'








---
- hosts: dev
  become: yes

  tasks:
    - name: Clone Git repository
      ansible.builtin.git:
        repo: "https://github.com/adityaghaywat-cmd/html.project.git"
        dest: /var/www/html
        version: main

    - name: Start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true










---
- hosts: dev
  become: yes

  tasks:
    - name: Clone Git repository
      ansible.builtin.git:
        repo: "https://github.com/adityaghaywat-cmd/html.project.git"
        dest: /var/www/html
        version: main

    - name: Allow HTTP service in firewalld
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true

    - name: Start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true









---
- hosts: dev
  become: yes

  tasks:
    - name: Create project directory
      file:
        path: /var/www/html/project1
        state: directory
        mode: '0755'

    - name: Copy index.html
      copy:
        src: /root/project1/index.html
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Allow HTTP port 80
      firewalld:
        port: 80/tcp
        permanent: yes
        state: enabled
        immediate: yes

    - name: Start nginx
      service:
        name: nginx
        state: started
                                         





        
