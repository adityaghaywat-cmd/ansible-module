---
- hosts: webserver
  become: yes

  tasks:

    - name: Install nginx
      yum:
        name: nginx
        state: present

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Copy website files to remote machine
      copy:
        src: /root/project2/index.html
        dest: /usr/share/nginx/html/
        owner: nginx
        group: nginx
        mode: '0755'
